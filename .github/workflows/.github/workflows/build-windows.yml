name: Build Windows Setup
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build standalone application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name AI_Font_Finder_PRO --collect-all cv2 --collect-all PIL AI_Font_Finder_PRO.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Setup EXE
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: AI_Font_Finder_PRO_Setup_Windows
          path: output/AI_Font_Finder_PRO_Setup.exe
